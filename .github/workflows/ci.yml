name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  generate:
    name: Generate jobs (Python ${{ matrix.python }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.13"]
    defaults:
      run:
        # keep each step's output, so a failure can be reported as an annotation (last step)
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python requirements
        run: pip install -r requirements.txt duckdb
      - name: The committed dataset catalogs are what add_dataset derives
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          cp -r datasets/example "$RUNNER_TEMP/example"
          python -m datafarm.datasets.add_dataset "$RUNNER_TEMP/example" --data datasets/example/data
          python .github/scripts/same_catalog.py datasets/example "$RUNNER_TEMP/example"
      - name: Generate jobs for every platform and dataset
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          for combo in TPCH:Flink TPCH:Wayang TPCH:Spark TPCH:SQL TPCH:SQLServer TPCH:SQLServerFlat \
                       JOB:Wayang JOB:Spark JOB:SQL JOB:SQLServer \
                       job:Flink job:Wayang job:Spark job:SQL job:SQLServer \
                       example:Flink example:Wayang example:Spark example:SQL example:SQLServer; do
            dataset=${combo%%:*}; platform=${combo#*:}
            echo "::group::$platform on $dataset"
            python RunGenerator.py --dataset $dataset --platform $platform --plans 5 --versions 2
            echo "::endgroup::"
            python - "training-data/${platform}_${dataset}/generated_jobs/generated_jobs_info.json" <<'EOF'
          import json, sys
          jobs = json.load(open(sys.argv[1]))
          assert len(jobs) == 10, f"expected 10 jobs, got {len(jobs)}"
          print(f"{len(jobs)} jobs described in {sys.argv[1]}")
          EOF
          done
      - name: Check the SQL jobs with DuckDB
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          for dataset in TPCH JOB job example; do
            python .github/scripts/check_sql_jobs.py training-data/SQL_$dataset/generated_jobs
          done
      - name: Compile the Spark jobs
        if: matrix.python == '3.13'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          for dataset in TPCH JOB job example; do
            (cd training-data/Spark_$dataset/generated_jobs && sbt -batch package)
          done
      - name: Run the TPC-H Spark jobs on a small TPC-H dataset
        if: matrix.python == '3.13'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          git clone --depth 1 https://github.com/electrum/tpch-dbgen.git "$RUNNER_TEMP/dbgen"
          make -C "$RUNNER_TEMP/dbgen" -s
          mkdir -p "$RUNNER_TEMP/tpch"
          (cd "$RUNNER_TEMP/dbgen" && DSS_PATH="$RUNNER_TEMP/tpch" ./dbgen -s 0.01 -f)
          chmod 644 "$RUNNER_TEMP"/tpch/*.tbl
          pip install pyspark==3.5.3
          python datafarm/execution/spark/run_spark_jobs.py training-data/Spark_TPCH/generated_jobs \
            --data "$RUNNER_TEMP/tpch" --no-build --master "local[2]" --conf spark.ui.enabled=false \
            --plans "$RUNNER_TEMP/spark_plans" --output "$RUNNER_TEMP/spark_results.csv" --timeout 600
          cat "$RUNNER_TEMP/spark_results.csv"
      - name: Run the example Spark jobs
        if: matrix.python == '3.13'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          python datafarm/execution/spark/run_spark_jobs.py training-data/Spark_example/generated_jobs \
            --data datasets/example/data --no-build --master "local[2]" --conf spark.ui.enabled=false \
            --output "$RUNNER_TEMP/example_spark.csv" --timeout 600
          cat "$RUNNER_TEMP/example_spark.csv"
      - name: Compile the Flink jobs and run the example Flink jobs
        if: matrix.python == '3.13'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          python datafarm/execution/flink/run_flink_jobs.py training-data/Flink_job/generated_jobs --build-only
          python datafarm/execution/flink/run_flink_jobs.py training-data/Flink_example/generated_jobs \
            --data datasets/example/data --timeout 600 --output "$RUNNER_TEMP/example_flink.csv"
          cat "$RUNNER_TEMP/example_flink.csv"
      - name: Same seed gives the same jobs
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          python RunGenerator.py --dataset job --platform SQL --plans 5 --versions 2 --experiment again
          diff -r training-data/SQL_job/generated_jobs training-data/again/generated_jobs
      # Apache Wayang 1.1 is built for Java 17; last, since the generator (Scala 2.11) needs Java 11
      - uses: actions/setup-java@v4
        if: matrix.python == '3.13'
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - name: Compile the Wayang jobs against Apache Wayang
        if: matrix.python == '3.13'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          for dataset in TPCH JOB job example; do
            (cd training-data/Wayang_$dataset/generated_jobs && sbt -batch compile)
          done
      - name: Run the TPC-H Wayang jobs on a small TPC-H dataset
        if: matrix.python == '3.13'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          if [ ! -f "$RUNNER_TEMP/tpch/lineitem.tbl" ]; then
            git clone --depth 1 https://github.com/electrum/tpch-dbgen.git "$RUNNER_TEMP/dbgen"
            make -C "$RUNNER_TEMP/dbgen" -s
            mkdir -p "$RUNNER_TEMP/tpch"
            (cd "$RUNNER_TEMP/dbgen" && DSS_PATH="$RUNNER_TEMP/tpch" ./dbgen -s 0.01 -f)
            chmod 644 "$RUNNER_TEMP"/tpch/*.tbl
          fi
          for platforms in java spark; do
            python datafarm/execution/wayang/run_wayang_jobs.py training-data/Wayang_TPCH/generated_jobs \
              --data "$RUNNER_TEMP/tpch" --platforms $platforms --timeout 600 \
              --output "$RUNNER_TEMP/wayang_results_$platforms.csv"
            cat "$RUNNER_TEMP/wayang_results_$platforms.csv"
            python datafarm/execution/wayang/run_wayang_jobs.py training-data/Wayang_example/generated_jobs \
              --data datasets/example/data --platforms $platforms --timeout 600 \
              --output "$RUNNER_TEMP/example_wayang_$platforms.csv"
            cat "$RUNNER_TEMP/example_wayang_$platforms.csv"
          done
      - name: Run the TPC-H and example SQL jobs on DuckDB and PostgreSQL
        if: matrix.python == '3.13'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          pip install "psycopg[binary]"
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres'"
          export DATAFARM_POSTGRES="host=localhost user=postgres password=postgres dbname=postgres"
          export DATAFARM_DUCKDB="$RUNNER_TEMP/tpch.duckdb"
          for engine in duckdb postgres; do
            python datafarm/execution/sql/load_sql_data.py --engine $engine --dataset TPCH --data "$RUNNER_TEMP/tpch" \
              --schema training-data/SQL_TPCH/generated_jobs/schema.sql
            python datafarm/execution/sql/run_sql_jobs.py training-data/SQL_TPCH/generated_jobs --engine $engine \
              --timeout 600 --output "$RUNNER_TEMP/sql_results_$engine.csv"
          done
          export DATAFARM_DUCKDB="$RUNNER_TEMP/example.duckdb"
          sudo -u postgres psql -c "CREATE DATABASE example"
          export DATAFARM_POSTGRES="host=localhost user=postgres password=postgres dbname=example"
          for engine in duckdb postgres; do
            python datafarm/execution/sql/load_sql_data.py --engine $engine --dataset example --data datasets/example/data \
              --schema training-data/SQL_example/generated_jobs/schema.sql
            python datafarm/execution/sql/run_sql_jobs.py training-data/SQL_example/generated_jobs --engine $engine \
              --timeout 600 --output "$RUNNER_TEMP/example_$engine.csv"
          done
      - name: Same row counts on every platform (TPC-H, then the example dataset)
        if: matrix.python == '3.13'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          python .github/scripts/compare_row_counts.py \
            spark="$RUNNER_TEMP/spark_results.csv" \
            wayang-java="$RUNNER_TEMP/wayang_results_java.csv" \
            wayang-spark="$RUNNER_TEMP/wayang_results_spark.csv" \
            sql-duckdb="$RUNNER_TEMP/sql_results_duckdb.csv" \
            sql-postgres="$RUNNER_TEMP/sql_results_postgres.csv"
          python .github/scripts/compare_row_counts.py \
            spark="$RUNNER_TEMP/example_spark.csv" \
            flink="$RUNNER_TEMP/example_flink.csv" \
            wayang-java="$RUNNER_TEMP/example_wayang_java.csv" \
            wayang-spark="$RUNNER_TEMP/example_wayang_spark.csv" \
            sql-duckdb="$RUNNER_TEMP/example_duckdb.csv" \
            sql-postgres="$RUNNER_TEMP/example_postgres.csv"
      - name: Report the end of the log
        if: failure()
        run: |
          tail -n 40 "$RUNNER_TEMP/ci.log" | grep -v '^\s*$' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > "$RUNNER_TEMP/tail.txt"
          echo "::error title=Last lines of the failing step::$(cat "$RUNNER_TEMP/tail.txt")"

  labeling:
    name: Labeling code (Python 3.8)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install requirements
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz libgraphviz-dev
          pip install -r requirements-labeling.txt "pytest<8"
      - name: Tests of the quantile forest
        run: python -m pytest -q datafarm/labeling/ActiveModel/quantile/tests
      - name: Every module imports
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'EOF'
          import importlib, pkgutil, datafarm
          for m in pkgutil.walk_packages(datafarm.__path__, "datafarm."):
              importlib.import_module(m.name)
          import RunGenerator, RunLabelForecaster
          print("all modules import")
          EOF
